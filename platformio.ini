; tesserae-device-bedside: firmware for the Bedside Dashboard (Jorgo).
;
; Pimoroni Pico Plus 2 W (RP2350B, 16 MB flash, 8 MB PSRAM) driving the
; Waveshare 10.3" e-Paper HAT (IT8951 controller, ED103TC2 glass, 1872x1404,
; 16 greys) through the Hard Stuff "Pico to Pi HAT" adapter. Pulls its dashboard
; from a Tesserae server over the v1 REST device API (see docs/tesserae.md),
; draws the menu and status overlays itself, and serves a bench web page for
; tuning. Grown from ed103tc2-pico-driver (same board, adapter and panel).
;
; ---- Build-time knobs (add to build_flags) -----------------------------------
;   -DEPD_VCOM_MV=2000      VCOM from the label on the panel's FPC cable, in mV
;                           (positive): the installed panel reads "-1.45V". A wrong VCOM
;                           degrades the panel over time; the web UI's VCOM box
;                           overrides it for the session.
;   -DEPD_PIN_CS=8 -DEPD_PIN_MISO=12 -DEPD_PIN_RST=17 -DEPD_PIN_HRDY=1
;                           pin overrides (defaults in include/epd_io.h, verified
;                           on the Hard Stuff adapter 29 Oct 2026)
;   -DEPD_PIN_PROBE=0       disable the slow/mode-3/swapped fallbacks
;   -DEPD_SPI_HZ=4000000    SPI clock request; default 4 MHz, actually 3.75 MHz
;                           with the integer PIO divider. 18.75 MHz corrupts reads.
;   -DEPD_MIRROR_H=0        the 10.3" glass is mirrored relative to the IT8951
;                           raster; default 1 un-mirrors it. Flip if the test
;                           card's black corner square shows top-RIGHT.
;   -DTESSERAE_KIND=\"esp32_client\"
;                           device kind announced to the server. esp32_client +
;                           gamut gray_16 is what the server's own 10.3" IT8951
;                           board (Seeed reTerminal E1003) uses and selects the
;                           esp32_gray_bin renderer. Use the id of the bundled
;                           tesserae/hardware/*.json entry once it is installed.
;   -DBTN_PIN=15            optional external button (to GND), same grammar as BOOTSEL
;   -DLONG_PRESS_MS=600     short/long press threshold
;   -DMENU_MOVE_MODE=2      refresh menu moves with GC16 instead of A2 (6)
; Credentials and the server URL come from include/secrets.h (gitignored; copy
; include/secrets.h.example) and are stored in flash on first boot; the web UI
; can change them afterwards.
; ------------------------------------------------------------------------------

[env:pimoroni_pico_plus_2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pimoroni_pico_plus_2w
framework = picosdk
build_src_filter = +<*> -<test_paint.c>     ; the paint test has its own main() (env:paintest)

; stdio over USB CDC (printf -> serial monitor); never block at boot.
build_flags =
    -DPIO_STDIO_USB
    -DPICO_STDIO_USB_ENABLE_RESET_VIA_BAUD_RATE=0   ; main.c takes the 1200-baud reset: it shows "Updating firmware" first
    ; RM2 radio on the Pico Plus 2 W; lwIP is linked by the picosdk builder in
    ; threadsafe-background mode (callbacks run from an interrupt context).
    -DPICO_CYW43_SUPPORTED=1
    -DCYW43_HOST_NAME=\"bedside\"
    ; VCOM from the installed panel's FPC label: -1.45 V on the second ED103TC2
    ; (the first panel was -1.48 V). Wrong VCOM can damage the panel; do not
    ; tune it to compensate for refresh or connection faults.
    -DEPD_VCOM_MV=1450
    ; The PIO uses an integer divider, so requesting 4 MHz runs at 3.75 MHz.
    ; With 12 mA / fast-slew pins, 12.5 MHz passed memory checks but still left
    ; the visible image faded; 3.75 MHz plus sound cables and power was clean.
    -DEPD_SPI_HZ=4000000
    -DEPD_DRIVE_MA=12
    -DEPD_FAST_SLEW=1
    ; Over-the-air updates (src/ota.c) install images built with
    ; -DPICO_CRT0_IMAGE_TYPE_TBYB=1 ("try before you buy": rolled back by the boot
    ; ROM unless they commit). Release CI builds that .bin; local and USB builds
    ; stay normal, as a trial image can't be started over USB.

; lwIP: make include/lwipopts.h win over the SDK's bundled btstack copy (DNS on).
extra_scripts =
    pre:scripts/lwip_prepend.py
    pre:scripts/build_www.py
    pre:scripts/build_mbedtls.py
    pre:scripts/build_birds.py

; Open the serial monitor with: pio device monitor
monitor_speed = 115200
; pico USB CDC stdio only emits once the host asserts DTR; assert it on connect.
monitor_dtr = 1
monitor_rts = 1

; Bare paint test (src/test_paint.c): the controller driven with Waveshare's
; reference sequence, nothing else running. pio run -e paintest; load the
; .pio/build/paintest/firmware.uf2 into the booting slot with picotool -p.
[env:paintest]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pimoroni_pico_plus_2w
framework = picosdk
build_src_filter = +<test_paint.c> +<epd_io.c>
build_flags =
    -DPIO_STDIO_USB
    -DEPD_DRIVE_MA=12
    -DEPD_FAST_SLEW=1
extra_scripts =
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
