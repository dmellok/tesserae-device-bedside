<!doctype html>
<html><head><meta charset="utf-8"><title>Bedside firmware: block diagram</title>
<style>
  html,body{margin:0;background:#fff}
  body{width:1264px;font:15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;color:#1b1b1a}
  svg{display:block}
  text{stroke:none}
  .t{font-size:15px;font-weight:600;fill:#1b1b1a}
  .s{font-size:12.5px;fill:#5f5c56}
  .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#7a766f}
  .box{fill:#fff;stroke:#c9c4bb;stroke-width:1.2}
  .ext{fill:#f1efea}
  .hw{fill:#1b1b1a;stroke:#1b1b1a}
  .tw{font-size:15px;font-weight:600;fill:#fff}
  .sw{font-size:12.5px;fill:#cfcbc4}
  .grp{fill:#faf9f6;stroke:#e2ddd4;stroke-width:1;stroke-dasharray:4 3}
  .mem{fill:#fdf6e7;stroke:#e3c98f}
  .arr{stroke:#1b1b1a;stroke-width:1.6;fill:none;marker-end:url(#a)}
  .arr2{stroke:#1b1b1a;stroke-width:1.6;fill:none;marker-end:url(#a);marker-start:url(#b)}
  .lab{font-size:11.5px;fill:#5f5c56}
  .note{font-size:12.5px;fill:#5f5c56}
</style></head>
<body>
<svg width="1264" height="1020" viewBox="0 0 1264 1020" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1a"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#1b1b1a"/></marker>
</defs>

<text x="24" y="34" style="font-size:22px;font-weight:700">Bedside Dashboard firmware: how the code is put together</text>
<text x="24" y="56" class="s">Pico Plus 2 W: two cores, 16 MB flash, 8 MB PSRAM. One box per module family; the arrows follow the data.</text>

<!-- ===== outside world ===== -->
<text x="40" y="92" class="h">OUTSIDE THE PANEL</text>
<rect x="40" y="100" width="272" height="58" rx="10" class="box ext"/>
<text x="54" y="124" class="t">Phone or computer</text><text x="54" y="144" class="s">the panel's own web app, over Wi-Fi</text>
<rect x="336" y="100" width="272" height="58" rx="10" class="box ext"/>
<text x="350" y="124" class="t">Home Assistant</text><text x="350" y="144" class="s">MQTT, 80 entities auto-discovered</text>
<rect x="632" y="100" width="272" height="58" rx="10" class="box ext"/>
<text x="646" y="124" class="t">Tesserae server</text><text x="646" y="144" class="s">renders the dashboards (REST)</text>
<rect x="928" y="100" width="272" height="58" rx="10" class="box ext"/>
<text x="942" y="124" class="t">GitHub releases</text><text x="942" y="144" class="s">firmware updates, over HTTPS</text>

<!-- ===== network ===== -->
<rect x="24" y="190" width="1192" height="112" rx="14" class="grp"/>
<text x="1200" y="212" class="h" text-anchor="end">NETWORK · core 0 · Wi-Fi, lwIP, mbedTLS</text>
<rect x="40" y="226" width="272" height="62" rx="10" class="box"/>
<text x="54" y="248" class="t">net.c</text><text x="54" y="268" class="s">HTTP server: the pages, /api, /audio</text>
<rect x="336" y="226" width="272" height="62" rx="10" class="box"/>
<text x="350" y="248" class="t">ha.c · live.c</text><text x="350" y="268" class="s">entities; the Live page's values</text>
<rect x="632" y="226" width="272" height="62" rx="10" class="box"/>
<text x="646" y="248" class="t">tesserae.c · net_rest.c</text><text x="646" y="268" class="s">pair, poll, stream frames to PSRAM</text>
<rect x="928" y="226" width="272" height="62" rx="10" class="box"/>
<text x="942" y="248" class="t">ota.c</text><text x="942" y="268" class="s">releases, verify, trial boot, roll-back</text>

<path d="M176,158 V226" class="arr2"/>
<path d="M472,158 V226" class="arr2"/>
<path d="M768,158 V226" class="arr2"/>
<path d="M1064,158 V226" class="arr"/>

<!-- ===== application ===== -->
<rect x="24" y="336" width="1192" height="256" rx="14" class="grp"/>
<text x="1200" y="358" class="h" text-anchor="end">THE APPLICATION · core 0</text>

<rect x="40" y="372" width="272" height="78" rx="10" class="box"/>
<text x="54" y="396" class="t">main.c · commands.c</text>
<text x="54" y="415" class="s">boot, the main loop, key and knob</text><text x="54" y="432" class="s">bindings, every command, state JSON</text>

<rect x="336" y="372" width="272" height="78" rx="10" class="box"/>
<text x="350" y="396" class="t">ui_*.c  (local.h)</text>
<text x="350" y="415" class="s">menus, Live page, home overlay,</text><text x="350" y="432" class="s">alarm clock and chorus, the settings</text>

<rect x="632" y="372" width="272" height="78" rx="10" class="box"/>
<text x="646" y="396" class="t">screens.c · paint.c</text>
<text x="646" y="415" class="s">what is on the panel (one row generator)</text><text x="646" y="432" class="s">and when to refresh it (partial / clean)</text>

<rect x="928" y="372" width="272" height="78" rx="10" class="box"/>
<text x="942" y="396" class="t">config.c · store.c</text>
<text x="942" y="415" class="s">settings and the recordings, in flash</text><text x="942" y="432" class="s">after the firmware; the flash writer</text>

<rect x="40" y="484" width="272" height="78" rx="10" class="box"/>
<text x="54" y="508" class="t">inputs.c · seesaw.c</text>
<text x="54" y="527" class="s">knob and keys over I2C: debounce,</text><text x="54" y="544" class="s">press / hold, backlights, night colours</text>

<rect x="336" y="484" width="272" height="78" rx="10" class="box"/>
<text x="350" y="508" class="t">alarm_sched.c · power.c</text>
<text x="350" y="527" class="s">the next alarm and its wake-up window;</text><text x="350" y="544" class="s">battery and mains from the ADC</text>

<rect x="632" y="484" width="272" height="78" rx="10" class="box"/>
<text x="646" y="508" class="t">draw.c · fonts · icons</text>
<text x="646" y="527" class="s">per-row drawing; Albert Sans and</text><text x="646" y="544" class="s">Phosphor as bitmaps (tools/gen_font.py)</text>

<rect x="928" y="484" width="272" height="78" rx="10" class="box"/>
<text x="942" y="508" class="t">rainsynth.c · birds.c</text>
<text x="942" y="527" class="s">rain, ocean, noise, wind, recordings,</text><text x="942" y="544" class="s">thunder, the dawn chorus; plain C</text>

<!-- network -> application -->
<path d="M176,288 V372" class="arr2"/><text x="184" y="326" class="lab">commands, state, the preview</text>
<path d="M472,288 V372" class="arr2"/><text x="480" y="326" class="lab">state ↔ entities</text>
<path d="M768,288 V372" class="arr"/><text x="776" y="326" class="lab">a new frame is ready</text>
<path d="M1064,288 V372" class="arr"/><text x="1072" y="326" class="lab">new firmware → the spare slot</text>

<!-- within the application -->
<path d="M312,411 H336" class="arr2"/>
<path d="M608,411 H632" class="arr"/>
<path d="M176,484 V450" class="arr"/>
<path d="M472,484 V450" class="arr"/>
<path d="M768,484 V450" class="arr"/>

<!-- ===== core 1 ===== -->
<rect x="24" y="624" width="1192" height="152" rx="14" class="grp"/>
<text x="74" y="650" class="h">REAL TIME · core 1</text>
<text x="74" y="676" class="note">Only the painter and the sound</text>
<text x="74" y="694" class="note">run here, so the network never</text>
<text x="74" y="712" class="note">stalls a refresh or the rain.</text>

<rect x="336" y="658" width="272" height="92" rx="10" class="box"/>
<text x="350" y="682" class="t">it8951.c · epd_io.c</text>
<text x="350" y="701" class="s">the e-paper controller: PIO SPI at</text><text x="350" y="718" class="s">12.5 MHz, waveforms, VCOM, the</text><text x="350" y="735" class="s">forced waveform temperature</text>

<rect x="632" y="658" width="272" height="92" rx="10" class="box"/>
<text x="646" y="682" class="t">painter.c</text>
<text x="646" y="701" class="s">one paint job at a time, from a frozen</text><text x="646" y="718" class="s">snapshot of the layers and the frame;</text><text x="646" y="735" class="s">core 0 keeps responding meanwhile</text>

<rect x="928" y="658" width="272" height="92" rx="10" class="box"/>
<text x="942" y="682" class="t">audio.c · spk_dsp.c</text>
<text x="942" y="701" class="s">a 10 ms timer renders into a ring; I2S</text><text x="942" y="718" class="s">DMA plays it through the tone stage</text><text x="942" y="735" class="s">(low cut, bass, treble, soften, limiter)</text>

<path d="M768,562 V658" class="arr"/><text x="776" y="606" class="lab">the snapshot, when something changed</text>
<path d="M1064,562 V658" class="arr"/><text x="1072" y="606" class="lab">rendered on core 1's timer</text>
<path d="M632,704 H608" class="arr"/>

<!-- ===== hardware ===== -->
<text x="40" y="810" class="h">HARDWARE</text>
<rect x="40" y="820" width="160" height="60" rx="10" class="box hw"/>
<text x="54" y="844" class="tw">Knob · 4 keys</text><text x="54" y="864" class="sw">seesaw boards, I2C</text>
<rect x="212" y="820" width="100" height="60" rx="10" class="box hw"/>
<text x="226" y="844" class="tw">PowerBoost</text><text x="226" y="864" class="sw">battery, ADC</text>
<rect x="336" y="820" width="272" height="60" rx="10" class="box hw"/>
<text x="350" y="844" class="tw">10.3" e-paper, IT8951</text><text x="350" y="864" class="sw">1872 × 1404, 16 greys, GC16 / DU</text>
<rect x="928" y="820" width="272" height="60" rx="10" class="box hw"/>
<text x="942" y="844" class="tw">Speaker · MAX98357A amp</text><text x="942" y="864" class="sw">I2S on GP18 / 19 / 21, enable on GP16</text>

<path d="M56,820 V562" class="arr"/>
<path d="M300,820 V604 H472 V562" class="arr"/>
<path d="M472,750 V820" class="arr"/>
<path d="M1064,750 V820" class="arr"/>

<!-- ===== memory ===== -->
<rect x="40" y="918" width="568" height="80" rx="10" class="box mem"/>
<text x="54" y="942" class="t">PSRAM 8 MB</text><text x="54" y="962" class="s">two dashboard frames (1.3 MB each), the audio ring, the HTTPS working</text><text x="54" y="980" class="s">memory, firmware downloads on their way to flash, the console log</text>
<rect x="632" y="918" width="568" height="80" rx="10" class="box mem"/>
<text x="646" y="942" class="t">Flash 16 MB</text><text x="646" y="962" class="s">firmware slots A and B (an update lands in the spare one and rolls back</text><text x="646" y="980" class="s">if it fails to start), the recordings, the settings</text>

<!-- the flash writer: ota and config land in flash, down the right margin -->
<path d="M1200,411 H1228 V958 H1200" class="arr"/>
<text x="1246" y="690" class="lab" transform="rotate(90 1246 690)" text-anchor="middle">to flash: updates, settings, files</text>
</svg>
</body></html>
